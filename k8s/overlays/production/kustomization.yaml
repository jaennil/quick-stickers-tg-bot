apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sticker-bot

resources:
  - ../../base
  - ingress.yaml
  - bot-config-sealed.yaml
  - ghcr-sealed.yaml
  - postgres-sealed.yaml

images:
  - name: bot
    newName: ghcr.io/jaennil/quick-stickers-tg-bot/bot
    newTag: latest
  - name: api
    newName: ghcr.io/jaennil/quick-stickers-tg-bot/bot
    newTag: latest
  - name: xray
    newName: teddysun/xray
    newTag: "1.8.24"
