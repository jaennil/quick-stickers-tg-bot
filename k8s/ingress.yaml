apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: sticker-bot
spec:
  ingressClassName: traefik
  rules:
    - host: sb.dubrovskih.ru
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bot-api
                port:
                  number: 8080
