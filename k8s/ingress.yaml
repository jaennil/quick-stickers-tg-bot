apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: sticker-bot
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: sticker-bot-rewrite-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: k8s.ru.tuna.am
      http:
        paths:
          - path: /bot-api
            pathType: Prefix
            backend:
              service:
                name: bot-api
                port:
                  number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rewrite-api
  namespace: sticker-bot
spec:
  replacePathRegex:
    regex: ^/bot-api/(.*)
    replacement: /api/$1
