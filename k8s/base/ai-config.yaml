# Shared by bot and api: search must embed queries with the very same model the
# indexer wrote vectors with, so these values cannot live in one deployment only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-config
data:
  AI_EMBED_MODEL: "gemini-embedding-001"
  AI_VISION_MODEL: "gemini-3.1-flash-lite"
  AI_MIN_SCORE: "0.60"
