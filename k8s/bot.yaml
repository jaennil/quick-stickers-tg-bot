apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  namespace: sticker-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: bot
          image: ghcr.io/jaennil/quick-stickers-tg-bot/bot:latest
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        - name: xray
          image: teddysun/xray:latest
          args: ["xray", "run", "-c", "/etc/xray/config.json"]
          volumeMounts:
            - name: xray-config
              mountPath: /etc/xray/config.json
              subPath: config.json
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: config
          secret:
            secretName: bot-config
        - name: xray-config
          configMap:
            name: xray-config
---
apiVersion: v1
kind: Service
metadata:
  name: bot
  namespace: sticker-bot
spec:
  selector:
    app: bot
  ports:
    - port: 8080
      targetPort: 8080
      name: metrics
  type: ClusterIP
