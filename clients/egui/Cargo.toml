[package]
name = "sticker-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["image"] }
tokio = { version = "1", features = ["full", "sync"] }
grammers-client = "0.7"
grammers-session = "0.7"
grammers-tl-types = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rdev = "0.5"
image = "0.25"
directories = "5"
md5 = "0.7"
anyhow = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
