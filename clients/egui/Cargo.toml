[package]
name = "qsg"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["image"] }
tokio = { version = "1", features = ["full", "sync"] }
grammers-client = "0.7"
grammers-session = "0.7"
grammers-tl-types = "0.7"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
global-hotkey = "0.7"
image = "0.25"
directories = "5"
md5 = "0.7"
anyhow = "1"
urlencoding = "2"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
arboard = "3"
