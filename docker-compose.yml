services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ocr:
        condition: service_started
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - shared_tmp:/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ocr:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    restart: unless-stopped
    volumes:
      - shared_tmp:/tmp

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sticker
      POSTGRES_PASSWORD: sticker
      POSTGRES_DB: sticker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sticker -d sticker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  shared_tmp:
