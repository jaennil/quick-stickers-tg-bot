telegram:
  token: "YOUR_TELEGRAM_BOT_TOKEN"

database:
  driver: "postgres"
  dsn: "postgres://sticker:sticker@postgres:5432/sticker?sslmode=disable"

ocr:
  proxy_url: "socks5://xray.proxy.svc.cluster.local:1080"  # in Kubernetes use shared xray service; for Docker use host.docker.internal:2080
  space_api_keys:
  - "YOUR_OCR_SPACE_API_KEY"
