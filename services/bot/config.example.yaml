telegram:
  token: "YOUR_TELEGRAM_BOT_TOKEN"

database:
  driver: "postgres"
  dsn: "postgres://sticker:sticker@postgres:5432/sticker?sslmode=disable"

ocr:
  proxy_url: "socks5://xray.proxy.svc.cluster.local:1080"  # in Kubernetes use shared xray service; for Docker use host.docker.internal:2080
  # Media the OCR cannot read is still described by the vision model, so it is
  # kept by default. Set to true to go back to dropping it.
  skip_without_text: false
  space_api_keys:
  - "YOUR_OCR_SPACE_API_KEY"

ai:
  token: "YOUR_AITUNNEL_TOKEN"
  base_url: "https://api.aitunnel.ru/v1"
  # gemini-embedding-001 beat gemini-embedding-2 on this library: MRR 0.88 vs 0.83
  model: "gemini-embedding-001"
  # Reads the text off each image and describes it, so media is findable both by
  # what it says and by what it shows. Costs ~0.066 RUB per item, once.
  vision_model: "gemini-3.1-flash-lite"
  dimensions: 768
  # 0.60 keeps every correct answer while dropping ~90% of the library
  min_score: 0.60
  index_interval_seconds: 2
